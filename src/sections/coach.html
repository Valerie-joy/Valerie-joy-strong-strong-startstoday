<!-- Meet your coach — every [bracketed] item must come from the brand before launch -->
<section class="section" id="coach">
  <div class="container coach__grid">
    <div class="coach__media reveal">
      <div class="photo photo--arch" role="img" aria-label="Photo placeholder: coach portrait">
        <div class="photo__label">
          <span class="photo__tag">COACH PORTRAIT</span>
          <span class="photo__note">Warm, natural-light portrait of the coach. Needed from the brand.</span>
        </div>
      </div>
    </div>
    <div class="coach__copy reveal">
      <span class="eyebrow eyebrow--rule">Meet Your Coach</span>
      <h2 class="h2"><span class="placeholder">[Coach name]</span>, founder of <em>The KASH Method</em></h2>
      <p class="lead"><span class="placeholder">[2–3 sentences from the brand: who she is, why she created The KASH Method, and who she built it for.]</span></p>
      <p class="coach__quote"><span class="placeholder">[A short line in her own words.]</span></p>
      <span class="coach__name"><span class="placeholder">[Coach name]</span></span>
    </div>
  </div>
</section>
